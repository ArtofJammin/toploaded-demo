name: Refresh reviews
on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviews-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'ArtofJammin/toploaded-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public feedback
        env:
          REFRESH_EVENT: ${{ github.event_name }}
        run: |
          if [ "$REFRESH_EVENT" = workflow_dispatch ]; then
            node tools/update-reviews.mjs --force
          else
            node tools/update-reviews.mjs
          fi
      - name: Commit public review highlights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews-tcgplayer.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh attributed TCGplayer review highlights'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
