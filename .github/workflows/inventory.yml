# Three daily inventory refreshes. Pull the shop's live TCGplayer listings into
# inventory.json + inventory-summary.json and commits them when anything changed,
# then pages.yml publishes the successful result. Also runs on demand (Admin
# calls workflow_dispatch through the API, or use the Actions tab).
name: Refresh inventory

on:
  schedule:
    - cron: "17 2,10,18 * * *" # EDT: 10:17 PM, 6:17 AM, 2:17 PM; EST: one hour earlier
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull TCGplayer listings
        run: python tools/update-inventory.py
      - name: Commit if changed
        run: |
          git config user.name "toploaded-bot"
          git config user.email "toploaded-bot@users.noreply.github.com"
          git add inventory.json inventory-summary.json
          if git diff --cached --quiet; then
            echo "No inventory changes."
          else
            git commit -m "Inventory update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
