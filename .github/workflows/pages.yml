name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN inventory commits do NOT trigger push workflows or legacy Pages.
  workflow_run:
    workflows: [Refresh inventory, Refresh catalog, Refresh reviews]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the site
        run: |
          node tools/check.mjs
          git diff --exit-code -- index.html
      - uses: actions/configure-pages@v5
      - name: Package public files only
        run: |
          mkdir _site
          cp index.html inventory.json inventory-summary.json favicon.png logo-dark.png logo-light.png og-image.png _site/
          cp catalog-*.json _site/
          cp reviews-tcgplayer.json reviews-google.json _site/
          mkdir _site/venue-plans
          cp venue-plans/hilton-first-floor.svg venue-plans/hilton-first-floor.json _site/venue-plans/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
