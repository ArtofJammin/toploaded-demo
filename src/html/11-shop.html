  <!-- ================= SHOP ================= -->
  <section class="view" id="view-shop" aria-label="Shop">
    <div class="wrap">
      <div class="view-head">
        <p class="eyebrow">Live inventory &middot; Singles &amp; sealed</p>
        <h1>The case, online</h1>
        <p class="lede">Every card here is a live listing from our TCGplayer store, synced every morning. Add it to your cart, buy it on TCGplayer, or call <a href="tel:+15132222573">(513) 222-2573</a> and we'll hold it at the counter.</p>
      </div>

      <div class="shop-tools" role="group" aria-label="Filters">
        <div class="shop-row shop-row-top">
          <div class="field shop-search">
            <label for="shopSearch">Search the case</label>
            <div class="search-wrap">
              <input id="shopSearch" type="search" placeholder="Card name, set, rarity&hellip;" autocomplete="off" spellcheck="false" enterkeyhint="search">
              <button class="search-clear" id="shopSearchClear" type="button" aria-label="Clear search" hidden>&times;</button>
            </div>
          </div>
          <div class="sort-wrap">
            <label for="sortSel">Sort</label>
            <select id="sortSel">
              <option value="feat">Featured</option>
              <option value="asc">Price: low to high</option>
              <option value="desc">Price: high to low</option>
              <option value="name">Name A&ndash;Z</option>
              <option value="new">Newest</option>
              <option value="value">Best value vs market</option>
            </select>
          </div>
        </div>

        <div class="shop-row">
          <div class="chip-row" id="gameChips" role="group" aria-label="Filter by game">
            <button class="chip" data-game="all" aria-pressed="true">All games</button>
            <button class="chip" data-game="pk" aria-pressed="false">Pokemon</button>
            <button class="chip" data-game="op" aria-pressed="false">One Piece</button>
            <button class="chip" data-game="mtg" aria-pressed="false">Magic</button>
            <button class="chip" data-game="gundam" aria-pressed="false">Gundam</button>
          </div>
          <button class="chip chip-wish" id="wishChip" aria-pressed="false" type="button"><span class="heart-ico" aria-hidden="true">&#9829;</span> Wishlist (<span id="wishChipCount">0</span>)</button>
          <button class="chip more-filters" id="moreFilters" type="button" aria-expanded="false" aria-controls="shopFacets">More filters<span id="moreFiltersCount"></span></button>
        </div>
        <div class="shop-facets" id="shopFacets">

        <div class="shop-row shop-row-facets">
          <div class="chip-row" id="typeChips" role="group" aria-label="Filter by product type">
            <button class="chip" data-type="all" aria-pressed="true">Everything</button>
            <button class="chip" data-type="single" aria-pressed="false">Singles</button>
            <button class="chip" data-type="sealed" aria-pressed="false">Sealed</button>
          </div>
          <div class="field set-wrap">
            <label for="setSel">Set</label>
            <select id="setSel"><option value="">All sets</option></select>
          </div>
          <div class="chip-row" id="condChips" role="group" aria-label="Filter by condition">
            <button class="chip" data-cond="" aria-pressed="true">Any condition</button>
            <button class="chip" data-cond="NM" aria-pressed="false" title="Near Mint">NM</button>
            <button class="chip" data-cond="LP" aria-pressed="false" title="Lightly Played">LP</button>
            <button class="chip" data-cond="MP" aria-pressed="false" title="Moderately Played">MP</button>
            <button class="chip" data-cond="HP" aria-pressed="false" title="Heavily Played">HP</button>
            <button class="chip" data-cond="DMG" aria-pressed="false" title="Damaged">DMG</button>
          </div>
        </div>

        <div class="shop-row shop-row-price">
          <div class="chip-row" id="priceChips" role="group" aria-label="Quick price range">
            <button class="chip" data-min="" data-max="5" aria-pressed="false">Under $5</button>
            <button class="chip" data-min="5" data-max="25" aria-pressed="false">$5&ndash;25</button>
            <button class="chip" data-min="25" data-max="100" aria-pressed="false">$25&ndash;100</button>
            <button class="chip" data-min="100" data-max="" aria-pressed="false">$100+</button>
          </div>
          <div class="price-range">
            <label for="priceMin">Price</label>
            <input id="priceMin" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Min" aria-label="Minimum price">
            <span aria-hidden="true">&ndash;</span>
            <input id="priceMax" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Max" aria-label="Maximum price">
          </div>
          <label class="stock-toggle"><input type="checkbox" id="stockOnly" checked> In stock only</label>
          <button class="linklike reset-filters" id="resetFilters" type="button" hidden>Reset filters</button>
        </div>

        <div class="shop-row" id="rarityRow" hidden>
          <div class="chip-row" id="rarityChips" role="group" aria-label="Filter by rarity"></div>
        </div>
        </div>
      </div>

      <div class="freshness" id="shopFresh"><span class="dot"></span><span id="shopFreshText">Loading the case&hellip;</span></div>

      <div class="recent-row" id="recentRow" hidden>
        <div class="recent-head"><span class="eyebrow">Recently viewed</span><button class="linklike" id="recentClear" type="button">Clear</button></div>
        <div class="recent-strip" id="recentStrip"></div>
      </div>

      <h2 class="sr-only">Results</h2>
      <p class="shop-status" id="shopStatus" role="status" aria-live="polite"></p>
      <div class="grid shop-grid" id="shopGrid" aria-busy="true"></div>
      <div class="shop-more" id="shopMore" hidden>
        <button class="add load-more" id="loadMore" type="button">Show 24 more</button>
        <div class="shop-sentinel" id="shopSentinel" aria-hidden="true"></div>
      </div>
    </div>
  </section>
