<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="loginOverlay"></div>
<div class="login-modal" id="loginModal" role="dialog" aria-modal="true" aria-label="Staff login" hidden>
  <p class="eyebrow" style="margin-bottom:10px">Back of house</p>
  <h3>Staff login</h3>
  <form id="loginForm">
    <div class="field" style="margin-top:12px"><label for="loginPin">Passcode</label><input id="loginPin" type="password" autocomplete="current-password"></div>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn" type="submit">Log in</button>
      <button class="btn btn-ghost" type="button" id="loginCancel">Cancel</button>
    </div>
  </form>
  <p class="drawer-note" style="text-align:left; margin-top:14px">Demo gate &mdash; real staff accounts ship with the live build.</p>
</div>
