<!-- ================= CART ================= -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true">
  <div class="drawer-head">
    <h2>Your cart</h2>
    <button class="drawer-close" id="drawerClose" aria-label="Close cart">&times;</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="subtotal"><span>Subtotal</span><b id="cartTotal">$0.00</b></div>
    <button class="btn" id="checkoutBtn">Checkout &middot; demo only</button>
    <p class="drawer-note">Pickup in store or ship &middot; payments run through Square (simulated here)</p>
  </div>
</aside>
